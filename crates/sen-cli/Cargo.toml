[package]
name = "sen-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SenAgent CLI (sen): interactive chat, one-shot run, sessions, skills, serve"

[[bin]]
name = "sen"
path = "src/main.rs"

[dependencies]
sen-core = { workspace = true }
sen-server = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
rustyline = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# 内嵌前端资源（sen web 单文件提供 Web UI）
rust-embed = { version = "8", features = ["mime-guess", "interpolate-folder-path"] }
